version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-hybrid}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - ENABLE_LAYA=true
      - LAYA_CONFIDENCE_THRESHOLD=0.85
    restart: unless-stopped
