name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/sync_to_hf.yml'
  workflow_dispatch:

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          echo "Cloning Hugging Face Space..."
          git clone https://durgesh-kanzariya:$HF_TOKEN@huggingface.co/spaces/durgesh-kanzariya/conduit-backend /tmp/hf-space
          
          echo "Copying backend files to Space root..."
          cp -rf backend/* /tmp/hf-space/
          
          cd /tmp/hf-space
          git add .
          git commit -m "Auto-sync from GitHub main [skip ci]" || echo "No changes to commit"
          
          echo "Pushing updates to Hugging Face..."
          git push https://durgesh-kanzariya:$HF_TOKEN@huggingface.co/spaces/durgesh-kanzariya/conduit-backend main
